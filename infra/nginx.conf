resolver 127.0.0.11 valid=5s ipv6=off;

upstream catalog-api {
    zone catalog-api 64k;
    server backend:8080 resolve;
}

upstream audio-storage {
    zone audio-storage 64k;
    server storage:9000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 26m;

    location /api/uploads {
        proxy_pass http://catalog-api;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://catalog-api;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location /media/ {
        proxy_pass http://audio-storage/;
        proxy_set_header Host storage:9000;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
