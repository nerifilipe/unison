name: unison
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: unison
      POSTGRES_USER: unison
      POSTGRES_PASSWORD: unison-local
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unison -d unison"]
      interval: 3s
      timeout: 3s
      retries: 30
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: unison-local
      MINIO_ROOT_PASSWORD: unison-local-storage
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["audio-data:/data"]
  audio-seed:
    build:
      context: .
      dockerfile: infra/audio/Dockerfile
    environment:
      MINIO_ROOT_USER: unison-local
      MINIO_ROOT_PASSWORD: unison-local-storage
    depends_on: [storage]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/unison
      DATABASE_USER: unison
      DATABASE_PASSWORD: unison-local
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: unison-local
      S3_SECRET_KEY: unison-local-storage
      ROOM_ALLOWED_ORIGINS: ${ROOM_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: {condition: service_healthy}
      audio-seed: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      backend: {condition: service_healthy}
      audio-seed: {condition: service_completed_successfully}
volumes:
  postgres-data:
  audio-data:
