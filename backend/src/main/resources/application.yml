server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  task:
    scheduling:
      pool:
        size: 4
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/unison}
    username: ${DATABASE_USER:unison}
    password: ${DATABASE_PASSWORD:unison-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
unison:
  rooms:
    allowed-origins: ${ROOM_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:unison-local}
    secret-key: ${S3_SECRET_KEY:unison-local-storage}
  uploads:
    enabled: ${UPLOAD_WORKER_ENABLED:true}
